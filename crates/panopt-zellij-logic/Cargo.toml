[package]
name = "panopt-zellij-logic"
version = "0.1.0"
edition = "2021"

# Transport-free logic for the Zellij sidebar plugin: the projection-line
# parsers, the mode/filter/sort enums, and the shared view-state codec. Split
# out of `panopt-zellij` so this pure code is a normal workspace member that
# builds and tests on the host - the plugin crate itself only links against the
# Zellij host ABI and so can never run its own `cargo test`. The plugin depends
# on this crate by path and re-exports it; both targets (host + wasm) compile
# the same source.
[dependencies]
# The status interpreter (#142) classifies an agent's terminal output by regex.
# This crate is wasm-safe (it is what the plugin links), and `regex` compiles
# to wasm32-wasip1, so classification runs plugin-side and reports only the
# derived one-word state - no per-poll terminal-output payload to the daemon.
# `default-features = false` drops the unicode tables the status patterns do not
# need, keeping the wasm module small.
regex = { version = "1", default-features = false, features = ["std"] }
